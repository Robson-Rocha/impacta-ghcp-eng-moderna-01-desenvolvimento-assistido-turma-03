name: Passo 28 - validar manualmente persistencia

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: validado

jobs:
  progress_walkthrough:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Walkthrough: ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Progress walkthrough
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "26-conectar-com-interface.yml" \
            ".github/steps/25-validar-manualmente-persistencia.md" \
            "O teste funcional percorreu o CRUD pela API pública. Vamos complementar a evidência inspecionando o comportamento e o banco manualmente." \
            "Para avançar o walkthrough, comente \`${{ env.STEP_TRIGGER_PHRASE }}\` nesta issue." \
            "next"
