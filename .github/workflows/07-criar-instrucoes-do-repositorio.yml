name: Passo 7 - criar instrucoes do repositorio

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: validado

jobs:
  progress_walkthrough:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Walkthrough: ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Progress walkthrough
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "08-propor-repository-instructions-minimas.yml" \
            ".github/steps/07-criar-instrucoes-do-repositorio.md" \
            "A revisão ajudou a fortalecer a especificação. Agora vamos garantir que o Copilot saiba consultá-la durante o restante do trabalho." \
            "Para avançar o walkthrough, comente \`${{ env.STEP_TRIGGER_PHRASE }}\` nesta issue." \
            "next"

