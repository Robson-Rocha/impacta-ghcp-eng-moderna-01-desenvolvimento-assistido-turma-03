name: Validate solution

"on":
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TrainingCatalog.slnx
      - run: dotnet build TrainingCatalog.slnx --no-restore
      - run: dotnet test TrainingCatalog.slnx --no-build --no-restore