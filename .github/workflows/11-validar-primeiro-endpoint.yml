name: Validar primeiro endpoint

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: feito

jobs:
  post_step_11:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Walkthrough: ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Progress walkthrough
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "12-pedir-rascunho-prompt-file.yml" \
            ".github/steps/11-validar-primeiro-endpoint.md" \
            "Endpoint implementado. Agora vamos validá-lo manualmente." \
            "Para avançar o walkthrough, comente \`${{ env.STEP_TRIGGER_PHRASE }}\` nesta issue." \
            "next"
